<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Target vs Sales Report</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --A:#2f7de1;--A2:#4b94f0;--AD:#1f5fb8; /* accent — randomised per use by JS */
  --R:#FF3B30; /* flag red — never randomised */
  --BG:#e7ebf0;--SD:#b6bdc9;--SL:#ffffff;
  --TX:#1f2937;--MU:#6b7280;
  --DK:#2b3648;--DK2:#3a4658;--NRAD:18px
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--BG);color:var(--TX);font-size:13px;min-height:100vh;font-weight:500}
header{background:linear-gradient(135deg,var(--DK) 0%,var(--DK2) 100%);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 10px 24px rgba(43,54,72,.28);border-radius:0 0 22px 22px}
.logo{width:32px;height:32px;background:rgba(255,255,255,.12);border-radius:10px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 3px 3px 6px rgba(0,0,0,.35),inset -2px -2px 5px rgba(255,255,255,.08)}
header h1{font-size:.95rem;font-weight:700;color:#fff}
.hbadge{margin-left:auto;background:rgba(255,255,255,.08);color:#fff;padding:5px 12px;border-radius:20px;font-size:.65rem;font-weight:600;white-space:nowrap;box-shadow:inset 2px 2px 5px rgba(0,0,0,.3),inset -2px -2px 5px rgba(255,255,255,.06)}

.upload-wrap{background:var(--BG);padding:18px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.upload-box{flex:1;min-width:160px}
.upload-box label{display:block;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--MU);margin-bottom:6px}
.btn-wrap{display:flex;gap:12px;align-items:flex-end}
.fdrop{border:none;border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--BG);box-shadow:inset 5px 5px 10px var(--SD),inset -5px -5px 10px var(--SL);transition:.2s}
.fdrop:hover{box-shadow:inset 6px 6px 12px var(--SD),inset -6px -6px 12px var(--SL)}
.fdrop.ok{box-shadow:inset 3px 3px 7px var(--SD),inset -3px -3px 7px var(--SL),0 0 0 2px var(--A)}
.fdrop span{font-size:.76rem;color:var(--MU);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdrop.ok span{color:var(--A);font-weight:600}
input[type=file]{display:none}
.btn{border:none;padding:0 20px;height:38px;font-size:.78rem;font-weight:700;letter-spacing:.4px;border-radius:12px;cursor:pointer;transition:.15s;text-transform:uppercase;white-space:nowrap}
.btn-p{background:linear-gradient(145deg,var(--A2),var(--AD));color:#fff;box-shadow:6px 6px 12px var(--SD),-6px -6px 12px var(--SL)}
.btn-p:hover{filter:brightness(1.05)}
.btn-p:active{box-shadow:inset 4px 4px 8px rgba(0,0,0,.25),inset -3px -3px 7px rgba(255,255,255,.15)}
.btn-p:disabled{background:var(--BG);color:var(--MU);cursor:not-allowed;box-shadow:inset 3px 3px 6px var(--SD),inset -3px -3px 6px var(--SL)}
.btn-o{background:var(--BG);color:var(--A);border:none;display:none;box-shadow:6px 6px 12px var(--SD),-6px -6px 12px var(--SL)}
.btn-o:hover{box-shadow:inset 4px 4px 8px var(--SD),inset -4px -4px 8px var(--SL)}

.ov{display:none;position:fixed;inset:0;background:rgba(31,41,55,.45);backdrop-filter:blur(2px);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.modal{background:var(--BG);border-radius:22px;padding:24px;width:100%;max-width:340px;box-shadow:14px 14px 28px var(--SD),-14px -14px 28px var(--SL)}
.modal h2{font-size:.95rem;font-weight:700;color:var(--A);margin-bottom:4px}
.modal p{font-size:.72rem;color:var(--MU);margin-bottom:12px}
.inset{background:var(--BG);box-shadow:inset 3px 3px 7px var(--SD),inset -3px -3px 7px var(--SL)}
.numin{flex:1;padding:11px 12px;border:none;border-radius:12px;font-size:1rem;font-weight:700;color:var(--TX);outline:none;text-align:center;background:var(--BG);box-shadow:inset 5px 5px 10px var(--SD),inset -5px -5px 10px var(--SL)}
.numin:focus{box-shadow:inset 6px 6px 12px var(--SD),inset -6px -6px 12px var(--SL),0 0 0 2px var(--A)}
.lbl{font-size:.72rem;font-weight:700;color:var(--MU);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}

.tswitch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;cursor:pointer}
.tswitch input{opacity:0;width:0;height:0;position:absolute}
.tslider{position:absolute;inset:0;background:var(--BG);border-radius:26px;transition:.2s;pointer-events:none;box-shadow:inset 3px 3px 6px var(--SD),inset -3px -3px 6px var(--SL)}
.tslider::before{content:'';position:absolute;height:20px;width:20px;left:3px;top:3px;background:var(--BG);border-radius:50%;transition:.2s;box-shadow:3px 3px 6px var(--SD),-2px -2px 5px var(--SL)}
.tswitch input:checked+.tslider{box-shadow:inset 3px 3px 6px var(--AD),inset -3px -3px 6px var(--A2)}
.tswitch input:checked+.tslider::before{transform:translateX(20px);background:#fff}

.content{padding:20px 16px 16px}
.cbox{background:var(--BG);border-radius:var(--NRAD);padding:10px 18px;box-shadow:8px 8px 16px var(--SD),-8px -8px 16px var(--SL);margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bcard{background:var(--BG);border-radius:var(--NRAD);overflow:hidden;box-shadow:8px 8px 16px var(--SD),-8px -8px 16px var(--SL);transition:.15s;cursor:pointer}
.bcard:hover{box-shadow:5px 5px 10px var(--SD),-5px -5px 10px var(--SL)}
.bch{background:linear-gradient(145deg,var(--A2),var(--AD));color:#fff;padding:10px 14px;margin:6px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.bch span{font-size:.88rem;font-weight:800}
.bch small{font-size:.65rem;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:10px;font-weight:700}
.bcb{padding:6px 14px 14px}
.bcs{display:flex;justify-content:space-between;font-size:.78rem;padding:5px 0;font-weight:600}
.bcs:last-child{font-weight:800;padding-top:8px;margin-top:2px;box-shadow:inset 0 1px 0 var(--SD)}
.rl{color:var(--R);font-weight:700}

.tw{overflow-x:auto;border-radius:var(--NRAD);background:var(--BG);box-shadow:8px 8px 16px var(--SD),-8px -8px 16px var(--SL);padding:6px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.78rem}
th{background:var(--DK);color:#fff;padding:9px 10px;text-align:center;font-weight:700;white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
th.l{text-align:left}
td{padding:7px 10px;white-space:nowrap}
tbody tr:nth-child(even) td{background:rgba(182,189,201,.16)}
tbody tr:hover td{background:rgba(0,0,0,.05)}
.tot td{background:linear-gradient(145deg,var(--A2),var(--AD));color:#fff;font-weight:700}
.bhdr{background:linear-gradient(145deg,var(--A2),var(--AD));color:#fff;padding:9px 14px;font-size:.85rem;font-weight:700;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center}
.bhdr small{font-size:.62rem;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:10px}
.ph{text-align:center;padding:60px 16px;color:var(--MU)}
.ph h2{font-size:1.1rem;font-weight:700;color:var(--TX);margin-bottom:6px}
.err{background:var(--BG);color:var(--R);padding:10px 16px;border-radius:12px;margin:0 16px 10px;font-size:.76rem;display:none;box-shadow:inset 3px 3px 7px var(--SD),inset -3px -3px 7px var(--SL)}
.note{background:var(--BG);color:var(--TX);padding:10px 16px;border-radius:12px;margin:0 0 14px;font-size:.74rem;box-shadow:inset 3px 3px 7px var(--SD),inset -3px -3px 7px var(--SL);line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <h1>Sales Target vs Sales</h1>
  <span class="hbadge">Branch-wise</span>
</header>

<!-- THRESHOLD MODAL -->
<div class="ov" id="tov">
  <div class="modal">
    <h2 style="display:flex;justify-content:space-between">Set Ach% Threshold<span onclick="document.getElementById('tov').classList.remove('show')" style="cursor:pointer;color:var(--MU)">✕</span></h2>
    <p>Ach% at or below this value is marked red</p>
    <div style="margin:14px 0">
      <label class="lbl">Threshold %</label>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="number" id="tval" class="numin" value="0" min="0" step="0.01">
        <span style="font-size:1rem;font-weight:700;color:var(--MU)">%</span>
      </div>
      <div style="font-size:.65rem;color:var(--MU);margin-top:5px" id="tHint">Default is the overall Ach%. Change it for a custom value.</div>
    </div>
    <div class="inset" style="margin:14px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px">
      <label for="gpToggle" style="font-size:.75rem;font-weight:700;cursor:pointer">Enable GP% (Branch Wise)</label>
      <label class="tswitch"><input type="checkbox" id="gpToggle" onchange="syncGPToggle()"><span class="tslider"></span></label>
    </div>
    <div id="gpThreshWrap" style="display:none;margin:0 0 14px">
      <label class="lbl">GP% Threshold</label>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="number" id="gpTval" class="numin" value="10" min="0" max="100" step="0.1">
        <span style="font-size:1rem;font-weight:700;color:var(--MU)">%</span>
      </div>
      <div style="font-size:.65rem;color:var(--MU);margin-top:5px">Sales GP% below this will be highlighted red. GP% comes from the Sales file.</div>
    </div>
    <button class="btn btn-p" style="width:100%;margin-top:4px" onclick="confirmThreshold()">Apply &amp; Generate</button>
  </div>
</div>

<div class="upload-wrap">
  <div class="upload-box">
    <label>Target File (all sheets)</label>
    <div class="fdrop" id="td" onclick="document.getElementById('ti').click()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span id="tl">Upload Excel…</span>
    </div>
    <input type="file" id="ti" accept=".xlsx,.xls" onchange="handleUpload(this,'target')">
  </div>
  <div class="upload-box">
    <label>Sales File</label>
    <div class="fdrop" id="sd" onclick="document.getElementById('si').click()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span id="sl">Upload Excel…</span>
    </div>
    <input type="file" id="si" accept=".xlsx,.xls" onchange="handleUpload(this,'sales')">
  </div>
</div>
<div class="upload-wrap" style="padding-top:0">
  <div class="btn-wrap">
    <button class="btn btn-p" id="gb" onclick="generate()" disabled>Generate</button>
    <button class="btn btn-o" id="eb" onclick="exportExcel()">⬇ Save XLSX</button>
  </div>
</div>

<div class="err" id="err"></div>
<div id="app"><div class="ph"><h2>Upload both files to begin</h2></div></div>

<script>
const S={target:null,sales:null,thresh:0,gpEnabled:false,gpThresh:0.10,report:null,branchSel:null,listFilter:'all',redOnly:false};
let ACC={a:'#2f7de1',a2:'#4b94f0',ad:'#1f5fb8'};

/* ── random accent colour per use (hue kept away from red so red flags stay distinct) ── */
function hsl2hex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return'#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function randomizeColor(){
  const h=40+Math.random()*270;
  ACC={a:hsl2hex(h,62,44),a2:hsl2hex(h,66,54),ad:hsl2hex(h,64,34)};
  const r=document.documentElement.style;
  r.setProperty('--A',ACC.a);r.setProperty('--A2',ACC.a2);r.setProperty('--AD',ACC.ad);
}
randomizeColor();

const ROLE_UI={target:{d:'td',l:'tl'},sales:{d:'sd',l:'sl'}};
function handleUpload(input,role){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      if(role==='target'){
        S.target=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})}));
      }else{
        S.sales=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      }
      const ui=ROLE_UI[role];
      document.getElementById(ui.d).classList.add('ok');
      document.getElementById(ui.l).textContent='✓ '+f.name;
      document.getElementById('gb').disabled=!(S.target&&S.sales);
    }catch(x){showErr(x.message)}
  };
  r.readAsBinaryString(f);input.value='';
}
function showErr(m){const e=document.getElementById('err');e.textContent='⚠ '+m;e.style.display='block'}
function clrErr(){document.getElementById('err').style.display='none'}

/* ── formatting ── */
function inr(n){
  n=Math.round(n);const neg=n<0,s=Math.abs(n).toString();
  if(s.length<=3)return(neg?'-':'')+s;
  return(neg?'-':'')+s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3);
}
function fp(v){return(v===null||v===undefined)?'-':(v*100).toFixed(2)+'%'}
const isRed=v=>v!==null&&v!==undefined&&v<=S.thresh+1e-12;
function achCell(v){return`<td style="text-align:center;${isRed(v)?'color:var(--R);font-weight:700':''}">${fp(v)}</td>`}
function achTot(v){return`<td style="text-align:center;${isRed(v)?'color:#ffd9d5;':''}">${fp(v)}</td>`}
function gpCell(v){const red=v!==null&&v!==undefined&&v<S.gpThresh;return`<td style="text-align:center;${red?'color:var(--R);font-weight:700':''}">${fp(v)}</td>`}
function gpTot(v){const red=v!==null&&v!==undefined&&v<S.gpThresh;return`<td style="text-align:center;${red?'color:#ffd9d5;':''}">${fp(v)}</td>`}

/* ── sales-file parsing (same detection logic as the Warranty tool) ── */
function findHdr(rows){for(let i=0;i<Math.min(5,rows.length);i++)if(String(rows[i][0]).toLowerCase().includes('sales'))return i;return 0}
function findColByHeader(h,tests){
  for(let i=0;i<h.length;i++){
    const x=String(h[i]||'').trim().toLowerCase();if(!x)continue;
    for(const t of tests){if(typeof t==='string'){if(x===t)return i}else if(t.test(x))return i}
  }return -1;
}
function colUsableIn(rows,hS,col){
  if(col<0)return false;let f=0,c=0;
  for(let i=hS+1;i<rows.length;i++){const v=rows[i]&&rows[i][col];if(v!==undefined){c++;if(String(v).trim())f++}}
  return c>0&&f/c>0.5;
}
function detectBranchCol(rows,hS){
  let col=findColByHeader(rows[hS]||[],['branch','branch name',/branch/]);
  if(!colUsableIn(rows,hS,col))col=18;
  if(!colUsableIn(rows,hS,col))col=-1;
  return col;
}
function detectSalesPriceCol(rows,hS){
  let col=findColByHeader(rows[hS]||[],['sales price','sale price',/sales?\s*price/]);
  if(!colUsableIn(rows,hS,col))col=2;
  return col;
}
function findGpCol(rows){
  if(!rows||!rows.length)return 6;
  let exact=-1,cand=-1,fb=-1;
  outer:for(let r=0;r<Math.min(10,rows.length);r++){
    const row=rows[r]||[];
    for(let i=0;i<row.length;i++){
      const raw=String(row[i]||'').trim();if(!raw)continue;
      const low=raw.toLowerCase(),norm=low.replace(/\s+/g,'');
      if(['salesgp%','salesgp','gp%','gp'].includes(norm)){exact=i;break outer}
      const has=/\bgp\b/.test(low)||norm.includes('gp%')||norm.includes('salesgp');
      if(has&&raw.includes('%')&&cand<0)cand=i;
      if(has&&fb<0)fb=i;
    }
  }
  return exact>=0?exact:cand>=0?cand:fb>=0?fb:6;
}
function parsePctVal(v){
  if(v===''||v===null||v===undefined)return null;
  let n;
  if(typeof v==='string'){
    const s=v.trim().replace(/,/g,'');if(!s)return null;
    n=parseFloat(s);if(isNaN(n))return null;
    n=s.includes('%')?n/100:(Math.abs(n)>1?n/100:n);
  }else if(typeof v==='number'){n=Math.abs(v)>1?v/100:v}else return null;
  return Math.abs(n)>3?null:n;
}
function parseNum(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v!=='string')return null;
  const s=v.replace(/[₹,\s]/g,'');if(!s||!/^-?\d+(\.\d+)?$/.test(s))return null;
  return parseFloat(s);
}

/* ── staff-name matching: KVT-MAHESWARAN-TCL (target) ≈ KVT1-MAHESWARAN-TCL (sales) ── */
function parseStaff(s){
  s=String(s).toUpperCase().replace(/\s+/g,' ').trim();
  const m=s.match(/^([A-Z]+)\d*\s*-\s*(.+)$/);
  const code=m?m[1]:'';
  const rest=(m?m[2]:s).replace(/[^A-Z0-9]/g,'');
  return{code,rest,key:code+'|'+rest};
}
const staffLike=s=>/^[A-Za-z]{2,6}\d*\s*-\s*[A-Za-z]/.test(String(s).trim());
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}

function buildSalesIndex(rows){
  const hS=findHdr(rows),spCol=detectSalesPriceCol(rows,hS),gpCol=findGpCol(rows),brCol=detectBranchCol(rows,hS);
  const map={};
  for(let i=hS+1;i<rows.length;i++){
    const r=rows[i],emp=String(r[0]||'').trim();if(!emp)continue;
    const sp=parseFloat(r[spCol])||0,gp=parsePctVal(r[gpCol]);
    const br=brCol>=0?String(r[brCol]||'').trim():'';
    if(!map[emp])map[emp]={emp,sp:0,gpW:0,gpD:0,br:''};
    const m=map[emp];m.sp+=sp;
    if(gp!==null){m.gpW+=gp*sp;m.gpD+=sp}
    if(!m.br&&br)m.br=br;
  }
  const entries=Object.values(map).map(m=>{
    const p=parseStaff(m.emp);
    return{emp:m.emp,sp:m.sp,gp:m.gpD>0?m.gpW/m.gpD:null,br:m.br,code:p.code,rest:p.rest,key:p.key};
  });
  // branch fallback by employee-code prefix (staff whose own branch cell is blank)
  const prefixBr={};
  entries.forEach(e=>{if(e.br&&e.code&&!prefixBr[e.code])prefixBr[e.code]=e.br});
  entries.forEach(e=>{if(!e.br)e.br=prefixBr[e.code]||''});
  const byKey={},byRest={};
  entries.forEach(e=>{
    if(!byKey[e.key])byKey[e.key]=e;
    (byRest[e.rest]=byRest[e.rest]||[]).push(e);
  });
  return{entries,byKey,byRest,prefixBr,noBranchCol:brCol<0};
}
function matchStaff(cell,idx){
  const p=parseStaff(cell);
  if(idx.byKey[p.key])return idx.byKey[p.key];
  if(p.rest.length>=4&&idx.byRest[p.rest]&&idx.byRest[p.rest].length===1)return idx.byRest[p.rest][0];
  if(staffLike(cell)&&p.rest.length>=4){
    let best=null,bs=0;
    idx.entries.forEach(e=>{
      if(p.code&&e.code&&p.code!==e.code)return;
      const L=Math.max(e.rest.length,p.rest.length);
      if(Math.abs(e.rest.length-p.rest.length)>Math.ceil(L*0.1))return;
      const sim=1-lev(p.rest,e.rest)/L;
      if(sim>bs){bs=sim;best=e}
    });
    if(best&&bs>=0.9)return best;
  }
  return null;
}

/* ── find the target value for a staff cell: nearest "Target" header above, else first number to the right ── */
function findTarget(rows,heads,r,c){
  let best=null;
  heads.forEach(h=>{
    if(h.r>=r)return;
    if(!best||h.r>best.r||(h.r===best.r&&Math.abs(h.c-c)<Math.abs(best.c-c)))best=h;
  });
  if(best){const v=parseNum(rows[r][best.c]);if(v!==null)return v}
  const row=rows[r];
  for(let j=c+1;j<row.length;j++){const v=parseNum(row[j]);if(v!==null)return v}
  return null;
}

function buildReport(){
  const idx=buildSalesIndex(S.sales);
  const seen={},recs=[],unmatched=[];
  let noTarget=0;
  S.target.forEach(sh=>{
    const rows=sh.rows,heads=[];
    rows.forEach((row,r)=>row.forEach((v,c)=>{
      if(typeof v==='string'&&/target/i.test(v)&&!/ach|%|achiev/i.test(v))heads.push({r,c});
    }));
    rows.forEach((row,r)=>row.forEach((v,c)=>{
      if(typeof v!=='string')return;
      const t=v.trim();if(t.length<5)return;
      const m=matchStaff(t,idx);
      if(!m&&!staffLike(t))return;
      const key=m?m.key:parseStaff(t).key;
      if(seen[key])return;
      const tg=findTarget(rows,heads,r,c);
      if(tg===null){if(m)noTarget++;return}
      seen[key]=1;
      if(m)recs.push({emp:m.emp,tg,sp:m.sp,gp:m.gp,br:m.br||'Unknown'});
      else{
        const code=parseStaff(t).code;
        recs.push({emp:t,tg,sp:0,gp:null,br:idx.prefixBr[code]||'Unmatched'});
        unmatched.push(t);
      }
    }));
  });
  if(!recs.length)throw new Error('No staff from the Target file matched the Sales file. Check the files.');
  recs.forEach(r=>{r.pct=r.tg>0?r.sp/r.tg:null});
  const branches={};
  recs.forEach(r=>{(branches[r.br]=branches[r.br]||[]).push(r)});
  Object.keys(branches).forEach(b=>branches[b].sort((a,c)=>(c.pct??-1)-(a.pct??-1)));
  const tSP=recs.reduce((s,r)=>s+r.sp,0),tTG=recs.reduce((s,r)=>s+r.tg,0);
  return{recs,branches,unmatched,noTarget,overall:tTG>0?tSP/tTG:0,tSP,tTG};
}

function syncGPToggle(){document.getElementById('gpThreshWrap').style.display=document.getElementById('gpToggle').checked?'block':'none'}
function generate(){
  clrErr();
  try{
    S.report=buildReport();
    document.getElementById('tval').value=(S.report.overall*100).toFixed(2);
    document.getElementById('tHint').textContent='Default = overall Ach% ('+fp(S.report.overall)+'). Change it for a custom value.';
    syncGPToggle();
    document.getElementById('tov').classList.add('show');
  }catch(e){showErr(e.message);console.error(e)}
}
function confirmThreshold(){
  const t=parseFloat(document.getElementById('tval').value);
  S.thresh=(isNaN(t)?S.report.overall*100:t)/100;
  S.gpEnabled=document.getElementById('gpToggle').checked;
  const g=parseFloat(document.getElementById('gpTval').value);
  S.gpThresh=(isNaN(g)?10:g)/100;
  document.getElementById('tov').classList.remove('show');
  randomizeColor();
  S.branchSel=null;S.listFilter='all';S.redOnly=false;
  render();
}

/* ── totals ── */
function branchTot(list){
  const sp=list.reduce((s,r)=>s+r.sp,0),tg=list.reduce((s,r)=>s+r.tg,0);
  let gw=0,gd=0;list.forEach(r=>{if(r.gp!==null&&r.sp>0){gw+=r.gp*r.sp;gd+=r.sp}});
  return{sp,tg,pct:tg>0?sp/tg:null,gp:gd>0?gw/gd:null};
}
const escAttr=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');

function listCard(b){
  const br=S.report.branches[b],t=branchTot(br);
  return`<div class="bcard" onclick="selectBranch('${escAttr(b)}')">
    <div class="bch"><span>${b}</span><small>${br.length} emp</small></div>
    <div class="bcb">
      <div class="bcs"><span>Target</span><span>₹${inr(t.tg)}</span></div>
      <div class="bcs"><span>Sales</span><span>₹${inr(t.sp)}</span></div>
      <div class="bcs"><span>Ach%</span><span class="${isRed(t.pct)?'rl':''}">${fp(t.pct)}</span></div>
    </div></div>`;
}
function detailCard(b){
  const full=S.report.branches[b];
  const br=S.redOnly?full.filter(r=>isRed(r.pct)):full;
  const t=branchTot(full),gp=S.gpEnabled;
  const rows=br.length?br.map((r,i)=>`<tr>
    <td style="text-align:center">${i+1}</td><td style="text-align:left">${r.emp}</td>
    ${gp?gpCell(r.gp):''}
    <td style="text-align:center">${inr(r.tg)}</td><td style="text-align:center">${inr(r.sp)}</td>${achCell(r.pct)}</tr>`).join('')
    :`<tr><td colspan="${gp?6:5}" style="text-align:center;padding:14px;color:#888">No red-marked employees in this branch</td></tr>`;
  return`<div class="bhdr"><span>${b}</span><small>${br.length} of ${full.length} employees</small></div>
  <div class="tw"><table>
    <thead><tr><th style="width:28px">#</th><th class="l">Sales Employee</th>${gp?'<th>Sales GP%</th>':''}<th>Target</th><th>Sales</th><th>Ach%</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="tot"><td colspan="2" style="text-align:center">TOTAL (branch)</td>${gp?gpTot(t.gp):''}
      <td style="text-align:center">${inr(t.tg)}</td><td style="text-align:center">${inr(t.sp)}</td>${achTot(t.pct)}</tr></tfoot>
  </table></div>`;
}

function render(){
  const R=S.report;
  document.getElementById('eb').style.display='inline-block';
  let note=`<div class="note"><b>Overall:</b> Target ₹${inr(R.tTG)} · Sales ₹${inr(R.tSP)} · Ach% <b>${fp(R.overall)}</b> · Red = Ach% ≤ ${fp(S.thresh)}`;
  if(R.unmatched.length)note+=`<br><span style="color:var(--R)">${R.unmatched.length} staff in Target not found in Sales (counted with 0 sales):</span> ${R.unmatched.slice(0,15).join(', ')}${R.unmatched.length>15?' …':''}`;
  if(R.noTarget)note+=`<br>${R.noTarget} matched staff skipped — no target value found next to the name.`;
  note+='</div>';
  document.getElementById('app').innerHTML=`<div class="content" id="p-branch">${note}<div id="bpanel"></div></div>`;
  refreshPanel();
}
function refreshPanel(){
  if(!S.report)return;
  const br=S.report.branches,bk=Object.keys(br).sort();
  const below=S.listFilter==='below';
  const listBk=below?bk.filter(b=>isRed(branchTot(br[b]).pct)):bk;
  const controls=`<div class="cbox">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:.72rem;font-weight:700">Red (≤ ${(S.thresh*100).toFixed(2)}%) Branches Only</label>
      <label class="tswitch"><input type="checkbox" ${below?'checked':''} onchange="toggleFilter(this.checked)"><span class="tslider"></span></label>
    </div>
    <div style="font-size:.68rem;color:var(--MU)">${listBk.length} of ${bk.length} branches</div>
  </div>`;
  let body;
  if(S.branchSel&&br[S.branchSel]){
    body=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <button class="btn btn-o" style="display:inline-block" onclick="backToList()">← Back to Branches</button>
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:.72rem;font-weight:700">Red Marked Only</label>
        <label class="tswitch"><input type="checkbox" ${S.redOnly?'checked':''} onchange="toggleRed(this.checked)"><span class="tslider"></span></label>
      </div></div>${detailCard(S.branchSel)}`;
  }else if(!listBk.length){
    body=`<div class="ph"><h2>No branches match</h2></div>`;
  }else body=`<div class="bgrid">${listBk.map(listCard).join('')}</div>`;
  document.getElementById('bpanel').innerHTML=controls+body;
}
function selectBranch(b){S.branchSel=b;S.redOnly=false;refreshPanel()}
function backToList(){S.branchSel=null;refreshPanel()}
function toggleFilter(v){S.listFilter=v?'below':'all';S.branchSel=null;refreshPanel()}
function toggleRed(v){S.redOnly=v;refreshPanel()}

/* ── Excel: single Branch Wise sheet ── */
function exportExcel(){
  if(!S.report)return;
  const X=h=>'FF'+h.slice(1).toUpperCase();
  const A1=X(ACC.a),A2=X(ACC.a2),AD=X(ACC.ad);
  const W='FFFFFFFF',K='FF000000',RED='FFFF0000';
  const bt=c=>({style:'thin',color:{rgb:c}}),btM=c=>({style:'medium',color:{rgb:c}});
  const hdr=()=>({font:{bold:true,color:{rgb:W},name:'Calibri',sz:12},fill:{patternType:'solid',fgColor:{rgb:A1}},alignment:{horizontal:'center',vertical:'center'},border:{top:btM(AD),bottom:btM(AD),left:btM(AD),right:btM(AD)}});
  const colHdr=()=>({font:{bold:true,color:{rgb:W},name:'Calibri',sz:13},fill:{patternType:'solid',fgColor:{rgb:A2}},alignment:{horizontal:'center',vertical:'center'},border:{top:btM(AD),bottom:btM(AD),left:btM(AD),right:btM(AD)}});
  const dat=(red,left)=>({font:{color:{rgb:red?RED:K},bold:!!red,name:'Calibri',sz:11},fill:{patternType:'solid',fgColor:{rgb:W}},alignment:{horizontal:left?'left':'center',vertical:'center'},border:{top:bt(K),bottom:bt(K),left:bt(K),right:bt(K)}});
  const cell=(v,s)=>(v&&typeof v==='object'&&v.v!==undefined)?{...v,s}:{v:v??'',t:typeof v==='number'?'n':'s',s};
  const N=v=>({v:Math.round(v),t:'n',z:'#,##0'});
  const P=v=>(v===null||v===undefined)?{v:'-',t:'s'}:{v,t:'n',z:'0.00%'};

  const{branches}=S.report,bk=Object.keys(branches).sort(),gp=S.gpEnabled,nCols=gp?5:4;
  const rows=[],merges=[],heights=[];let ri=0;
  bk.forEach(b=>{
    const br=branches[b];
    merges.push({s:{r:ri,c:0},e:{r:ri,c:nCols-1}});
    rows.push(Array.from({length:nCols},(_,i)=>i===0?cell(b+'  ('+br.length+' Sales Emp)',hdr()):cell('',{})));heights.push({hpx:22});ri++;
    rows.push((gp?['Sales Employee','Sales GP%','Target','Sales','Ach%']:['Sales Employee','Target','Sales','Ach%']).map(t=>cell(t,colHdr())));heights.push({hpx:28});ri++;
    br.forEach(r=>{
      const red=isRed(r.pct),gred=gp&&r.gp!==null&&r.gp<S.gpThresh;
      const c=[cell(r.emp,dat(false,true))];
      if(gp)c.push(cell(P(r.gp),dat(gred)));
      c.push(cell(N(r.tg),dat(false)),cell(N(r.sp),dat(false)),cell(P(r.pct),dat(red)));
      rows.push(c);heights.push({hpx:18});ri++;
    });
    const t=branchTot(br);
    const tc=[cell('TOTAL',colHdr())];
    if(gp)tc.push(cell(P(t.gp),colHdr()));
    tc.push(cell(N(t.tg),colHdr()),cell(N(t.sp),colHdr()),cell(P(t.pct),colHdr()));
    rows.push(tc);heights.push({hpx:28});ri++;
    rows.push(Array.from({length:nCols},()=>cell('',{})));heights.push({hpx:8});ri++;
  });
  const ws={'!ref':XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:nCols-1}})};
  rows.forEach((row,r)=>row.forEach((c,ci)=>{ws[XLSX.utils.encode_cell({r,c:ci})]=c}));
  ws['!cols']=gp?[{wch:40},{wch:11},{wch:16},{wch:16},{wch:9}]:[{wch:40},{wch:16},{wch:16},{wch:9}];
  ws['!merges']=merges;ws['!rows']=heights;
  const wb={SheetNames:['Branch Wise'],Sheets:{'Branch Wise':ws}};
  XLSX.writeFile(wb,'sales_target_branchwise.xlsx');
}
