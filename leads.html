<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="https://www.sathya.store/favicon.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV → Excel Processor</title>

  <!-- PapaParse: CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- SheetJS: Excel (.xlsx) export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
    }

    /* ── Top navigation ── */
    header {
      width: 100%;
      backdround:  #FF0000;
      display: flex;
      align-items: center;
      padding: 10px 24px;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      margin-bottom: 40px;
    }

    header .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ff0000;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color:#1a1a2e;
      letter-spacing: .3px;
      margin: 0;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: calc(100% - 48px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    }

    .card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Upload area */
    .upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 28px 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f8fafc;
      margin-bottom: 20px;
    }

    .upload-label:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .upload-label svg {
      color: #94a3b8;
    }

    .upload-label span {
      font-size: 0.875rem;
      color: #64748b;
    }

    .upload-label strong {
      color: #3b82f6;
    }

    /* Hide native file input */
    #csvInput { display: none; }

    /* Selected filename */
    .file-chosen {
      font-size: 0.8rem;
      color: #475569;
      text-align: center;
      margin-top: -12px;
      margin-bottom: 20px;
      min-height: 18px;
    }

    /* Process button */
    button#processBtn {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button#processBtn:hover:not(:disabled) {
      background: #2563eb;
    }

    button#processBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Status messages */
    .status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.5;
      display: none;
    }

    .status.info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; display: block; }
    .status.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status.error   { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; display: block; }
    .status.warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; display: block; }

    code {
      font-family: ui-monospace, monospace;
      font-size: 0.82em;
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<!-- ── Top navigation ── -->
<header>
  <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <h1>CSV — Excel Processor</h1>
  <nav style="display:flex;gap:4px;margin-left:18px">
    <a href="index.html" style="padding:5px 14px;border-radius:5px;font-size:.75rem;font-weight:700;text-decoration:none;background:#FF0000;color:#fff;letter-spacing:.5px;">Home</a>
    <a href="leads.html" class="active" style="padding:5px 14px;border-radius:5px;font-size:.75rem;font-weight:700;text-decoration:none;background:#FF0000;color:#fff;letter-spacing:.5px;border:1px solid rgba(255,255,255,.5)">Leads</a>
    <a href="he.html" class="active" style="padding:5px 14px;border-radius:5px;font-size:.75rem;font-weight:700;text-decoration:none;background:#FF0000;color:#fff;letter-spacing:.5px;border:1px solid rgba(255,255,255,.5)">High End</a>
    <a href="rev.html" style="padding:5px 14px;border-radius:5px;font-size:.75rem;font-weight:700;text-decoration:none;background:#FF0000;color:#fff;letter-spacing:.5px;border:1px solid rgba(255,255,255,.5)">Reviews</a>
  </nav>
</header>

<div class="card">
  <h1>CSV → Excel Processor</h1>
  <p class="subtitle">
    Filters out <em>closed sold</em> &amp; <em>closed lost</em> rows,
    then exports the selected columns as <strong>.xlsx</strong>.
  </p>

  <!-- Clickable upload zone -->
  <label class="upload-label" for="csvInput">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 16 12 12 8 16"></polyline>
      <line x1="12" y1="12" x2="12" y2="21"></line>
      <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
    </svg>
    <span><strong>Click to choose</strong> a CSV file</span>
    <span>or drag &amp; drop here</span>
  </label>

  <!-- Hidden native file input -->
  <input type="file" id="csvInput" accept=".csv,text/csv" />

  <!-- Shows selected filename -->
  <div class="file-chosen" id="fileChosen">No file selected.</div>

  <!-- Disabled until a valid CSV is loaded -->
  <button id="processBtn" disabled>Process CSV &amp; Download Excel</button>

  <!-- Feedback area -->
  <div class="status" id="status"></div>
</div>

<script>
  // ── Required column names (must match CSV headers exactly, after trimming) ──
  const REQUIRED_COLS = [
    "Phone Number",
    "Customer Name",
    "Store code",
    "Lead Owner's Name",
    "Product Name",
    "Status"
  ];

  // Status column values to exclude (matched case-insensitively)
  const EXCLUDE_STATUS = ["closed sold", "closed lost"];

  // Holds parsed rows after a successful CSV load
  let parsedRows = [];

  // ── DOM references ──────────────────────────────────────────────────────────
  const csvInput   = document.getElementById("csvInput");
  const processBtn = document.getElementById("processBtn");
  const statusEl   = document.getElementById("status");
  const fileChosen = document.getElementById("fileChosen");

  // ── Helper: render a status message ────────────────────────────────────────
  function showStatus(html, type /* "info" | "success" | "error" | "warning" */) {
    statusEl.className = `status ${type}`;
    statusEl.innerHTML = html;
  }

  // ── Step 1: Parse CSV when user picks (or drops) a file ────────────────────
  csvInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    // Reset state before re-parsing
    parsedRows = [];
    processBtn.disabled = true;
    statusEl.className  = "status";
    fileChosen.textContent = `📄 ${file.name}`;

    Papa.parse(file, {
      header: true,                        // treat first row as column names
      skipEmptyLines: true,                // ignore blank lines
      transformHeader: h => h.trim(),      // strip surrounding whitespace from headers

      complete: function (result) {
        const headers = result.meta.fields || [];

        // Check every required column is present
        const missing = REQUIRED_COLS.filter(col => !headers.includes(col));
        if (missing.length > 0) {
          showStatus(
            `<strong>Missing columns:</strong> ${missing.map(c => `<code>${c}</code>`).join(", ")}.<br>
             Please check that the CSV headers match exactly.`,
            "error"
          );
          return;
        }

        parsedRows = result.data;
        showStatus(
          `CSV loaded — <strong>${parsedRows.length}</strong> rows found. Click the button to process.`,
          "info"
        );
        processBtn.disabled = false;
      },

      error: function (err) {
        showStatus(`Parse error: ${err.message}`, "error");
      }
    });
  });

  // ── Step 2: Filter → select columns → export Excel ─────────────────────────
  processBtn.addEventListener("click", function () {

    // Filter: keep rows where Status is NOT in the exclude list (case-insensitive)
    const filtered = parsedRows.filter(row => {
      const statusVal = (row["Status"] || "").trim().toLowerCase();
      return !EXCLUDE_STATUS.includes(statusVal);
    });

    if (filtered.length === 0) {
      showStatus(
        "After filtering, <strong>no rows remain</strong>. Nothing to export.",
        "warning"
      );
      return;
    }

    // Select only the 6 required columns from each surviving row (preserving order)
    const selected = filtered.map(row => {
      const out = {};
      REQUIRED_COLS.forEach(col => { out[col] = row[col] ?? ""; });
      return out;
    });

    // Build the xlsx workbook
    const worksheet = XLSX.utils.json_to_sheet(selected, { header: REQUIRED_COLS });
    const workbook  = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "FilteredData"); // sheet name

    // Filename: day of the month only, e.g. "26.xlsx"
    const day      = new Date().getDate();
    const filename = `${day}.xlsx`;

    // Trigger browser download
    XLSX.writeFile(workbook, filename);

    const removed = parsedRows.length - filtered.length;
    showStatus(
      `✅ <strong>${filename}</strong> downloaded — ` +
      `<strong>${filtered.length}</strong> rows exported ` +
      `(${removed} filtered out).`,
      "success"
    );
  });

  // ── Drag-and-drop support on the upload zone ────────────────────────────────
  const uploadLabel = document.querySelector(".upload-label");

  uploadLabel.addEventListener("dragover", e => {
    e.preventDefault();
    uploadLabel.style.borderColor = "#3b82f6";
    uploadLabel.style.background  = "#eff6ff";
  });

  uploadLabel.addEventListener("dragleave", () => {
    uploadLabel.style.borderColor = "";
    uploadLabel.style.background  = "";
  });

  uploadLabel.addEventListener("drop", e => {
    e.preventDefault();
    uploadLabel.style.borderColor = "";
    uploadLabel.style.background  = "";
    const file = e.dataTransfer.files[0];
    if (file) {
      // Inject dropped file into the hidden input and fire change
      const dt = new DataTransfer();
      dt.items.add(file);
      csvInput.files = dt.files;
      csvInput.dispatchEvent(new Event("change"));
    }
  });
</script>
</body>
</html>
